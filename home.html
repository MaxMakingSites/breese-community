    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Do Not Click Button</title>
      <style>
        body {
          margin: 0;
          height: 100vh;
          background-color: #fff0f5;
          font-family: Arial, sans-serif;
        }
        .rickroll-button {
          position: fixed;
          bottom: 20px;
          right: 20px;
          padding: 15px 30px;
          font-size: 18px;
          font-weight: bold;
          background-color: red;
          color: white;
          border: none;
          border-radius: 10px;
          cursor: pointer;
          transition: background-color 0.3s;
          box-shadow: 0 4px 8px rgba(0,0,0,0.2);
          z-index: 1000;
        }
        .rickroll-button:hover {
          background-color: darkred;
        }
      </style>
    </head>
    <body>
    
    <button class="rickroll-button" onclick="rickroll()">DO NOT CLICK</button>
    
    <script>
      function rickroll() {
        window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
      }
    </script>
    
    </body>
    </html>
